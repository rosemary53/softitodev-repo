        //isim,açıklama,kategori,fiyat,stok,etiket

        const urunDetaylariGetir = async ()=>{

            try{
                console.log("Apiye bağlanılıyor");
                const response = await fetch("https://dummyjson.com/products");

                if(!response.ok){
                    throw new Error(`Http hatası:${response.status}`);
                }

                const data = await response.json();
                console.log(`Toplam ${data.products.length} adet kozmetik ürün çekildi.`);

                const urun = data.products.slice(2,data.products.length-1).map(product=>({
                     urun: product.title,
                     aciklama: product.description,
                     kategori:product.category,
                     fiyat: product.price,
                     stok: product.stock,
                     etiket: product.tags.join(",") //tagler normalde array şeklinde geliyorsa nasıl alacağız parçalayarak alacağız.
                }));
                console.table(urun);
            }catch(err){
                console.warn("Api Hatası", err.message);
            } 
        }
       
        urunDetaylariGetir();
