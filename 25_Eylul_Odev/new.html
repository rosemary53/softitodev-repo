<!DOCTYPE html> <!--Tarayıcıya bu sayfanın HTML5 kurallarına göre yazıldığı bilgisi verilir. Hangi sürümle yazıldığını bildirmek için.-->
<html lang="en"> <!--Bu sayfanın kök etiketidir. Sitedeki tüm kodlar bu etiket içine yazılır.-->

<head> <!-- Burası sayfanın ayarlanma kısmıdır. Burada tasarım dosyaları css, kimlik bilgileri vb. yazılır-->
    <meta charset="UTF-8"> <!-- Genel olarak dünyadaki var olan tüm dillerdeki ahrfleri sembolleri destekleyen standarttır. Örneğin türkçe karakterler ü,ğ,ö nün tanınması sağlanıyor.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Bu sitenin mobil uyumlu olmasını sağlayan kod parçasıdır. width = device-width ile bu siteye giren cihazın ekranına uyumlu olması sağlanır. initial-scale = zoom özelliği %100 olsun.-->

    <title>Sipariş & Gelir Kokpit Dashboard</title>  <!-- Sayfanın resmi ismidir.Ekranda görünmez. Tarayıcı sekmesinde, arama sonuçlarında yazar.-->
    <style> /* Bu etiketimiz sayfanın görsel tasarımını yapan CSS kdolarının yazıldığı alandır.*/

        :root { /* CSS değişkenleri alanıdır. Buraya yazdığımız özelliklere sayfanın her yerinden erişebiliriz. CSS değişkenlerini tanımlarken başına -- ekleriz.*/
            --bg: #f8f7f4;
            --card: #ffffff;
            --border: #e6e5df;
            --text: #181716;
            --muted: #6b6963;
            --clay: #c85a32;
            --clay-hover: #b04e29;
            --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { /* * işareti her şey anlamına gelir. Biz tüm tarayıcılarda aşağıdaki özellikleri uygulamlarınız isteriz.*/
            box-sizing: border-box; /* Ekran taşmasını engeller.*/
            margin: 0;/* Varsayılan dış boşlukları siler.*/
            padding: 0;/* Varsayılan iç boşlukları siler.*/
        }

        body {/* Web sayfasının kullanıcıya görünen ana kısmıdır. Ekranda gördüğümüz her şey Body kısmına eklenir. Temel denilebilir.*/
            background: var(--bg); /*Sayfanın genel arka planıdır. Buradaki var() fonksiyonu ile de root içinde tanımlanan css değişkenlerine erişilebilir.*/
            color: var(--text);/*Sitenin tüm metinlerinin genel rengini belirler. */
            font-family: var(--font-main);/*Sitedeki ana yazı tipini belirler.*/
            padding: 36px 16px; /*Sayfanın iç boşluklarını ayarlar. İlk değerimiz 36px Sayfanın top,bottom yani üstünden ve altından 36px boşluk bırakır. Sayfanın sağından solundan 16piksel boşluk bırakır.36px(top) 30px(Sağ) 16px(Alt) 14px(Sol) şeklinde de yapılabilir.*/
            line-height: 1.5; /*satırlar arası boşluğu ayarlar.*/
        }
        
        .kokpit {/*Bu bir HTML sınıfıdır. Bütün tasarımlarımızı butonlarımızı kutuları bu ana kutu içine yerleştiriyoruz.*/
            max-width: 960px;/* Bu kutunun genişliği max 960 piksel olabilir.Ekran ne kadar büyürse büyüsün 960 pikselden daha fazla bir alana yayılmayacak.*/
            margin: 0 auto; /* Üstten 0 alttan 0 boşluk auto ile de otomatik hesapla ve ana kutuyu sayfaya ortala*/
        }

        /* Header & KPI */
        .header {/*Başlık alanındaki tüm alanları içine alan bölümdür. Başlık bölümünü alt kısımlardan ayırır.*/
            margin-bottom: 24px; /*Başlık bölümünden sonra yani borderdan sonra gelen bölümü 24piksel aşağı konumlandır.*/
            padding-bottom: 16px;/* Başlık yazıları ve border ile arasına 16piksellik boşluk ekler.*/
            border-bottom: 1px solid var(--border);/* Başlığın tam altına 1 piksel kalınlığında ayırıcı çek.*/
        }

        .header__tag {/* Üst Başlık */
            font-size: 11px; /**Yazı boyutudur.*/
            text-transform: uppercase; /*Buranın aldığı değer küçük harfle girilse bile ekranda BÜYÜK harfler gösterir.*/
            letter-spacing: 0.12em;/* Harfler arası boşluk.*/
            color: var(--clay);/*Yazının rengi*/
            font-weight: 700; /*Yazı kalınlığı*/
        }

        .header__title {/*Ana başlık*/
            font-size: 26px;/* Yazı büyüklüğü*/
            font-weight: 700;/*Yazı Kalınlığı*/
            margin-top: 2px; /*Başlık bileşenin üstündeki bileşen olan header_Tag ile arasına 2px boşluk ekler.*/
        }

        .kpi-grid {/**/
            display: grid; /*Ana kutuya eklenen elemanları alt alta değil onları bir tablo sistemi gibi sırala*/
            grid-template-columns: repeat(3, 1fr);/* 3 tane yan yana sütun oluşturur. 1fr : genişliği mevcut boşluğa göre eşit olarak paylaştır. Yani yan yana 3 kutunun genişliği eşittir.*/
            gap: 14px; /* Kutular arasına 14px eşit boşluk koyar. Grid ve Flexbox sistemlerde kullanılır. elemanların sadece aralarındaki boşluğu tek seferde belirleyen boşluktur.*/
            margin-bottom: 24px; /* Bu kutu bölümünden sonra gelecek bölüm ile aralarına 24piksellik boşluk koyar.*/
        }

        .kpi-card {/* Tablo ızgara içindeki her bir kartın özelliği*/
            background: var(--card); /* Kartın arka planını belirler*/
            border: 1px solid var(--border); /* kartın etrafına 1 piksel kalınlığında ince gri çerçeve çeker.*/
            border-radius: 8px; /*Kartın kenarlarını 8piksel kadar ovalleştirir.*/
            padding: 14px 18px;/* Kartın içindeki bileşenlere üstten,alttan 14px sağdan soldan 18px boşluk ekler. Kartın içindeki bileşenlerin kartın içine yapışmasını engeller.*/
        }

        .kpi-card span {/* Kartın üstündeki yazı*/
            font-size: 12px;/*Yazının büyüklüğü*/
            color: var(--muted);/*Yazı rengi*/
            font-weight: 600;/*Yazı kalınlığı*/
        }

        .kpi-card h3 {/*Kart içindeki farklı özellikteki bir yazı*/
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-mono);
            margin-top: 4px;/*h3 elemanı üstündeki eleman ile aralarına 4px boşluk bırakmak istemiş*/
        }

        /* Layout */
        .layout {
            display: grid; /*İçindeki elemanları yan yana dizmek için kullanılır.*/
            grid-template-columns: 320px 1fr;/* 2 sütun oluşturur.Birinci sütuna 320px alan verir. İkinci sütuna ise 1fr yani 320 pikselden geriye ne kadar boşluk kalıyorsa geri kalan alanı sipariş listesi kaplasın.*/
            gap: 24px;/*Bu iki sütün arasındaki boşluk 24 piksel olarak ayarlanır.*/
        }

        @media (max-width: 768px) {/*Media Query. Mobil için 768 pikselden küçük bir cihazla girerse normal kuralları unut ve bu kuralları uygula*/

            .layout,
            .kpi-grid {
                grid-template-columns: 1fr; /*hem KPI kartlarını hem layoutu tek bir sütuna dönüştür. Yan yana duran form listeler ekranı küçültükçe kırılır ve aşağıya doğru listelenir.*/
            }
        }

        /* Form & Panel */
        .panel {/* Yeni sipariş kaydı ve sipariş listesini saran alanlardır.Diğer html elemanlarını içinde barındırır.*/
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .panel h4 {/*Panelin içindeki Başlık kutusu.*/
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;/*h4 kutusunun en alt çizgisi ile sonraki eleman arasındaki boşluktur.*/
            padding-bottom: 8px;/* h4 kutusunun iç kısmına uygulanıyor ve altındaki border arasındaki mesafeyi belirliyor.*/
            border-bottom: 1px solid var(--border);/*h4 kutusunun en altına yatay bir çizgi çeker.*/
        }

        .field {/*Formdaki her bir label ve inputu bir arada tutan kapsayıcı görünmez kutudur.*/
            margin-bottom: 12px; /*Her bir form elemanı arasına 12px mesafe koyar.*/
        }

        .field label {/* Üürn adı ,kategori metinlerin kutusudur..field sınıfına sahip bir kutu bulursan, onun içindeki BÜTÜN label etiketlerine otomatik olarak bu tasarımı uygula.*/
            display: block; /*Normalde label ve input alanı yan yana durur ama alt alta olmasını isityorsak labelin tüm satırı kaplamasını isteriz bundan dolayı display: block yaparız.*/
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;/*labeldan sonra gelen input arasına giren boşluktur.*/
        }

        .field input,
        .field select {/*Veri girilen kutu inputtur. Burada css tasarımalrı hem input kutusuna hem de select açılır menüye uygulanacak.*/
            width: 100%;/*.field alanı ne kadar büyükse sende ona göre o kdr genişle.*/
            padding: 8px 10px;/*input kutusunun içine girecek değerle üstten alttan 8pikselsağdan soldan 10 piksel boşluk bırakır.*/
            font-size: 13px;
            font-family: inherit;/*body kısmındaki fontu otomatik kabul etmezler inherit ile başta belirlenen yazı fontu miras alınır. */
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .field input:focus,
        .field select:focus {/*Kullanıcı kutunun içine tıklandığı an kutu aktif hale gelir*/
            outline: none;/*varsayılan odaklanma rengini kapatır*/
            border-color: var(--clay);/*odaklanma çerçeve rengini  --clay yapar.*/
            background: #fff; /*kutuya tıklandığında arka plan rengini beyaz yapar.*/
        }

        .btn-submit {/*Sipariş kaydet butonu tasarımı*/
            width: 100%; /*butonun genişliğini içinde bulunduğu form panelinin genişliğine tamamen yayar.*/
            background: var(--clay);
            color: #fff;/*buton içindeki yazı rengini beyaz yapar.*/
            border: none;/*Butonun etrafındaki çerçeveyi kaldırır.*/
            padding: 10px;/*buton kutusunun içindeki bileşen ile arasına boşluk ekler.*/
            font-size: 13px;/*Buton içindeki yazının büyüklüğünü 13 piksel yapar.*/
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer; /*Normal fare imlecini buton üzerine geldiğimizde el imlecine dönüştürür.Tıklanabilir özelliğini kullanıcıya gösterir.*/
            margin-top: 6px; /*Buton ile üzerindeki eleman arasına 6 piksel boşluk konulur.*/
        }

        .btn-submit:hover {/*fare ile butonun üzerine gelindiğinde*/
            background: var(--clay-hover);/* Fare ile butonun üzerine gelindiğinde buton rengini --clay-hover yapar.*/
        }

        /* Liste & Filtre */
        .filter-bar {/*içindeki arama kutusunu ve açılır menüyü yan yana dizer*/
            display: flex;/*Flexbox sadece yan yana(satır) veya sadece alt alta(sütun dizilecek elemanlar için üretilmiştir. Varsayılan oalrak yan yana dizer.*/
            gap: 10px;/*input ile açılır menu arasına */
            margin-bottom: 14px; /*filtre kutusu ile liste arasında 14 piksel boşluk koyuluyor.*/
        }

        .order-list {/*Sipariş listesi kapsayıcı kutu*/
            display: flex;/* Kutu içindeki siparişler dizmek için kullanılır.*/
            flex-direction: column; /* Normalde flex yan yana dizer ama biz alt alta dizmesini isityoruz.*/
            gap: 10px;/*alt alta dizilen her bir sipariş kutusunun arasına 10 piksel boşluk ekler.*/
        }

        .order-item {/*Her bir sipariş kutusu*/
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;/*Sipariş kutusunun içindeki yazıları kategoriler yan yana dizer. Çünkü varsayılan row dur.*/
            justify-content: space-between;/*İçindeki elemanları başa ve sona sabitler.*/
            align-items: center;/*soldaki elemanlar ile sağdaki elemanlar dikey olarak aynı hizada tam merkezde hizalanır.Biri yukarıda biri aşağıda kalmaz.*/
        }

        .order-item h5 {/* Ürün adı kutusu*/
            font-size: 13px;
            font-weight: 600;
        }

        .order-item p {/*Ürün fiyatı kutusu*/
            font-size: 12px;
            color: var(--muted);
        }

        .meta-box {/*Kategori etiketi/sil  kapsayıcı kutusu*/
            display: flex; /*etiket ve sil butonu yan yana*/
            align-items: center;/*etiket ve buton dikeyde tam ortadan hizalanır.*/
            gap: 10px;/*etiket ve buton sadece buton arasına 10 px boşluk eklenir.*/
        }

        .badge {/*Etiket sınıfı kutusu*/
            font-size: 11px;/*etiket yazısının büyüklüğü*/
            padding: 2px 7px;/* etiketin içindeki bileşenler ile boşluk ekler.*/
            border-radius: 4px;
            font-weight: 600;
            background: #fef3c7;
            color: #92400e;/*etiket içi yazı rengi*/
            font-family: var(--font-mono);
        }

        .badge--mobilya {/*Etiketin alacağı değere göre özelleşen alanlar*/
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge--aydinlatma {
            background: #fef3c7;
            color: #b45309;
        }

        .badge--seramik {
            background: #d1fae5;
            color: #065f46;
        }

        .btn-del {/*Silme butonu ilk hal*/
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-del:hover {/*Butonun üzerine fare ile gelince*/
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="kokpit"> <!--Ana kutumuz-->
        <header class="header"> <!--Başlık Kutumuz-->
            <span class="header__tag">Sipariş Takip</span> <!--Etiket yazısı-->
            <h1 class="header__title">Sipariş Yönetim Kokpiti</h1> <!--Başlık-->
        </header>

        <section class="kpi-grid"> <!--3 bilgi kartının kapsayıcı alanı-->
            <div class="kpi-card"> <!--3 karttan her biri-->
                <span>Kayıtlı sipariş</span>
                <h3 id="kpiCount">0</h3>
            </div>
            <div class="kpi-card">
                <span>Toplam Sipariş Tutar</span>
                <h3 id="kpiTotal">0 ₺</h3>
            </div>
            <div class="kpi-card">
                <span>Ortalama Ürün Fiyatı</span>
                <h3 id="kpiAvg">0 ₺</h3>
            </div>
        </section>

        <main class="layout"> <!--Grid sistemiyle ikiye böldüğümüz ekranın sol tarafıdır.-->
            <section class="panel"> <!--İki tane panelden bir tanesi-->
                <h4>Yeni sipariş kaydı</h4>
                <form id="orderForm"> <!--Form alanları-->
                    <!--Ürün Adının Yazdığı Alan-->
                    <div class="field"> <!--Label ve input alanı-->
                        <label for="prodName">Ürün Adı</label> <!--for ve id değerleri aynı olunca bunlar birbirlerine bağlanır labela tıklasan bile input aktif olur.-->
                        <input type="text" id="prodName" placeholder="Sehpa" required> <!--varsayılan örnek yer tutucudur. Kullanıcıya nasıl bir veri girilmesi gerektiği bilgisini verir.-->
                    </div>
                    <!--Ürün Kategorisinin Değeri-->
                    <div class="field">
                        <label for="prodCat">Kategori</label>
                        <select name="prodCat" id="prodCat"> <!--Açılır menü ana kutusudur. name backend için kullanılır id js kodlarını tetiklemek için -->
                            <option value="Mobilya">Mobilya</option> <!--Açılır menüdeli seçeneklerden birisidir.-->
                            <option value="Aydınlatma">Aydınlatma</option>
                            <option value="Mutfak">Mutfak</option>
                        </select>
                    </div>

                    <!--Ürünün Fiyatı-->
                    <div class="field"> 
                        <label for="prodPrice">Fiyat</label>
                        <input type="number" id="prodPrice" value="3250" min="100" step="50" required> <!--varsayılan 3250 min 100 değer alır ve 50 50 artar-->
                    </div>

                    <!--Kaydetme Butonu-->
                    <button type="submit" class="btn-submit">Siparişi Kaydet</button>
                </form>
            </section>

            <section class="panel"> <!--Sipariş listeleme paneli-->
                <div class="filter-bar"> <!--Filtreleme kısmı-->
                    <input type="text" id="searchInput" class="field" style="margin-bottom: 0;"
                        placeholder="Ürün Adına Göre Filtrele"> 
                    <select id="categoryFilter" style="width: 130px; font-size: 12px;padding: 6px;">
                        <option value="ALL">Tüm Kategoriler</option>
                        <option value="Mobilya">Mobilya</option>
                        <option value="Aydınlatma">Aydınlatma</option>
                        <option value="Mutfak">Mutfak</option>
                    </select>
                </div>
                <div id="orderContainer" class="order-list">
                    <!--Dinamik olarak elemanlar buraya basılacak /  eklenecek-->
                </div>
            </section>




        </main>




    </div>

    <script>
        //Manuel olarka oluşturduğumuz sipariş listesi
        let orders = [
            { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
            { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
            { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
            { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
            { id: 5, name: "Ocak", category: "Mutfak", price: 15000 }
        ];

        //dom elementleri toplayalım : HTML tarafında yazdığımız id etiketleri ile JS'ye bağlıyoruz. 
        const orderContainer = document.getElementById('orderContainer');
        const orderForm = document.getElementById('orderForm');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const kpiCount = document.getElementById('kpiCount');
        const kpiTotal = document.getElementById('kpiTotal');
        const kpiAvg = document.getElementById('kpiAvg');


        // 3 kart içindeki bilgileri günceller.
        const updateKPIs = (dataList) => {
            kpiCount.textContent = dataList.length; //Listedeki eleman sayısını kayıtlı spariş kartına basar.

            if (dataList.length === 0) {//listede hiç eleman kalmadıysa hepsini sıfırlar.
                kpiTotal.textContent = "0 ₺";
                kpiAvg.textContent = "0 ₺";
                return;
            }

            //Toplam Tutar v(.reduce)
            const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
            kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;

            //Ortalama Fiyat (.reduce)
            const avg = total / dataList.length;
            kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;

        }

        //Filtreleme bölümü (dinamik dom / Render Motoru)
        const renderOrders = () => {
            const term = searchInput.value.toLowerCase().trim();
            const selectedCat = categoryFilter.value;



            //filtreleme bölümü
            const filtered = orders.filter(order => {
                const matchesName = order.name.toLowerCase().includes(term); //Ürünün adında kullanıcının yazdığı kelime geçiyor mu?
                const mathesCategory = selectedCat === "ALL" || order.category === selectedCat;//tüm kategori mi yoksa ilgili kategori mi seçti
                return matchesName && mathesCategory; // eğer iksii de uyuyorsa o ürünü filtered adonda bir listeye alır.
            });

            orderContainer.innerHTML = ""; //kutunun içini temizler

            if (filtered.length === 0) { //filtremem sonucu sıfırsa
                orderContainer.innerHTML = `
                <div style="padding:24px; text-align:center; color:var(--muted);font-size:12px">
                    Kriterlere Uygun Ürün Bulunamadı
                    </div>
                `;//Kutunun içini kriterlere uygun ürün bulunamadı olarak doldurur döndürür.
                updateKPIs([]);
                return;
            }

            //dinamik element üretim: Filtrelenmiş listedeki her bir sipariş için HTML'de anlık olarak yeni bir <article> (kutu) yaratır.

            filtered.forEach(order => {
                const item = document.createElement("article");
                item.className = "order-item"; 
                item.setAttribute("data-id", order.id);//Üretilen HTML kutusunun üzerine görünmez bir barkod (data-id="1") yapıştırır.

                const badgeClass = order.category === "Mobilya" ? "badge--mobilya" : order.category === "Aydınlatma" ? "badge--aydinlatma" : "badge--seramik"; //ürünün kategorisine göre HTML'e basılacak olan renkli etiketin class adını otomatik seçer.

                item.innerHTML = `
                <div>
                    <h5>${order.name}</h5>
                    <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                    <span class="badge ${badgeClass}">${order.category}</span>
                    <button class="btn-del" data-action="delete">Sil</button>
                </div>                
                
                `; //geriye dönecek olan sipariş kutumuz

                orderContainer.appendChild(item);//Hazırlanan bu HTML kutusunu, sayfadaki ana çerçevenin içine ekleriz.

                updateKPIs(filtered);

            })

        }
       
        //Siparişi Kaydet Butonunun İşlevini Yazıyorum.
        orderForm.addEventListener("submit",(event)=>{
            event.preventDefault();//Sayfanın yenilenmesini engeller

            //Formadaki ınputlardaki değerleri alalım
            const nameInput = document.getElementById("prodName").value;
            const catInput = document.getElementById("prodCat").value;
            const priceInput = document.getElementById("prodPrice").value;

            //Eğer ürünün ismi boş ise ve ürün fiyatı negatif yani 0 dan düşük girildiyse 
            if(!nameInput || priceInput <= 0){
                return;
            }

            //Yeni sipraiş ekleyeceğimiz için ID'si de olmalıdır.
            const newId = orders.length > 0 ? Math.max(...orders.map(order => order.id)) + 1 : 1;

            //Yeni sipariş Nesnesi Oluşturuyoruz.
            const newOrder = {
                id: newId,
                name: nameInput,
                category: catInput,
                price: priceInput
            };
            // Sipraişler listesine ekle
            orders.push(newOrder);
            //Order listesi güncellendiği için ekranında bu güncellemeden haberi olamsı gerekiyor
            renderOrders();
            orderForm.reset();
        });

        // Var olan Siparişleri Silme : Butona tıklayınca gerçekleşecek
        orderContainer.addEventListener("click",(event)=>{
            //Sipariş kutusu içerisinde tıklanılan hedef bakılır. Tıklanan bileşenin  data-action'un neye 
            const dataAction = event.target.dataset.action;
            if(dataAction === "delete"){ 
                //Kullanıcıya doğrulama paneli sunmak istiyorum.
                const isConfirmed = confirm("Siparişinizi gerçekten silmek istiyor musunuz?");

                // İşlemi iptal ettiyse devamındaki kodların çalışmasını engellemek için bu kontrol yapılır ve fonksiyon sonlanır.
                if(!isConfirmed){ 
                    return;
                }
                //Hangi siparişe tıklandığını tespit etmemiz gerekiyor.
                const item = event.target.closest(".order-item"); //İlgili butonu kapsayan ana çerçeveyi bulmamız sağlar
                const deletedOrderId = Number(item.getAttribute("data-id")); //Sipariş ıd yi almamız sağlar.
                
                //Sipariş listesinde var olan tüm siparişlerin ID si ile silinecek olan ID nin değeri karşılaştırılıyor. Eğer sipariş olan ID silinecek olan sipariş ID sine eşit değilse listeye ekleniyor silinecek olan ID'ye eşit ise de listeye eklenmiyor haliyle yeni güncel listede yer almıyor.
                let newOrderList = [];
                for(let i=0; i<orders.length; i++){
                    let order = orders[i];
                    
                    if(order.id !== deletedOrderId){
                        newOrderList.push(order);
                    }
                }
                // Artık yeni listeyi eski listeye eşitliyoruz ki ekranda güncel veriler bulunsun.
                orders = newOrderList;

                //güncel listeyi ekrana yansıtacak fonksiyondur.
                renderOrders();
            }

        })

        searchInput.addEventListener("input", renderOrders);
        categoryFilter.addEventListener("change", renderOrders);

        renderOrders();
    </script>



</body>

</html>
