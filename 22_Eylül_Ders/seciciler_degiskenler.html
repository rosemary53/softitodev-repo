<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 Seçici & Değişkenler</title>
    <style>
        /*1.Global css değişkenleri
         root: içinde tanımladıklarımızı her yerde kullanabiliriz.
         Tüm sistemde çalışacak değişkenler root alanında tanımlandı
        */
        :root{
            --brand-primary: #4f46e5;
            --brand-accent: #06b6d4;
            --bg-surface:#fffffff;
            --text-main:#0f172a;
            --radius-md:12px;
        }
        /*Dark Mode Hazırlığı
          Bunları kim okuyor? Arka plandaki tarayıcı
         */
        @media (perefers-color-scheme: dark){
             :root{
                --bg-surface: #1e293b;
                --text-main: #f8fafc;
             }
        }

        /*
        var() fonksiyonu, önceden tanımlanmış css değişkenlerini çağırmak için kullanılır.
         */
        body{
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-main);
            padding: 24px;
        }
        /* Puan (0,0,0,1) = 1 Şu an yazacağımız css 1 puan olarak kodlandı*/
        button{
            background-color: gray;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            cursor: pointer;
        }

        /* İlgili butona özel :Puan (0,0,1,0) = 10 Class  -> Gray'ı ezer bundan dolayı puanı daha düşüktür.*/
        .btn-action{
            background-color: var(--brand-primary) ;
        }

        /*Buton actionu ezen bir bölüm Puan(0,0,1,1) -> btn-action ezer.*/
        button.btn-action{
            box-shadow: 0 4px 14px rgba(79,70,229,0.4);
        }

        /* Puan(0,1,0,0)= 100 puan ID seçici =#. Bütün butonları ezen bir durumdur.*/
        #submit-btn{
            background: linear-gradient(
                135deg,var(--brand-primary),var(--brand-accent)
            );
        }
        .btn-action:hover{
           transform: translateY(-2px);
           filter: brightness(1.1);
        }
          
        .btn-action:active{
            transform: translateY(0);
        }
    
    </style>
</head>
<body>
      <h2> Css Değişkenler</h2>
      <button id="submit-btn" class="btn-action">İşlemi Onayla</button>

</body>
</html>
